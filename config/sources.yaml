  - id: arath_gaf
    kind: gaf
    species: ARATH
    url: https://current.geneontology.org/annotations/gaf/ARATH-mod.gaf.gz
  - id: arath_gpi
    kind: gpi
    species: ARATH
    url: https://current.geneontology.org/annotations/gpi/ARATH-mod.gpi.gz
  - id: fly_gaf
