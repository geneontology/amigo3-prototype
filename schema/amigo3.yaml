          searchable: false
      taxon_id:
        range: string
        annotations:
          facet: false
          searchable: false
      species:
        range: string
        annotations:
          facet: true
          searchable: false
      record_kind:
        description: Legacy identity grouping; retained for existing query URLs.
        range: string
        annotations:
          facet: true
          searchable: false
      gene_product_types:
        description: Distinct supplied GPI/GAF product types, or Unspecified. A record may have multiple types.
        range: string
        multivalued: true
        annotations:
          facet: true
          searchable: false
      gene_product_type_ids:
        description: Product type ontology CURIEs normalized from GPI/GAF; raw assertions remain in the integration database.
        range: string
        multivalued: true
        annotations:
          facet: false
          searchable: false
      gene_product_type_groups:
        description: Distinct reflexive is_a closure over the product type navigation subset; includes ncRNA ancestors.
        range: string
        multivalued: true
        annotations:
          facet: true
          searchable: false
      annotation_count:
        range: integer
        annotations:
          facet: false
          searchable: false
      annotated_subject_ids:
        range: string
        multivalued: true
        annotations:
          facet: false
          searchable: false
      evidence_codes:
        range: string
        multivalued: true
        annotations:
          facet: true
          searchable: false
      term_ids:
