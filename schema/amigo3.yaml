id: https://w3id.org/amigo3/search
name: amigo3_search
title: AmiGO 3 search projections
description: Published search records. GAF and GPI are source adapters; this schema
  describes the engine-neutral projections. Annotation names align with GO Standard
  Annotation Schema, but GAF disjunctions remain grouped and relation labels are preserved.
prefixes:
  linkml: https://w3id.org/linkml/
  amigo3: https://w3id.org/amigo3/
imports:
- linkml:types
default_prefix: amigo3
default_range: string
classes:
  GeneRecord:
    description: Genes & products
    attributes:
      id:
        range: string
        identifier: true
        annotations:
          facet: false
          searchable: false
      symbol:
        range: string
        annotations:
          facet: false
          searchable: false
      name:
        range: string
        annotations:
          facet: false
          searchable: false
      synonyms:
        range: string
        multivalued: true
        annotations:
          facet: false
          searchable: false
      identifiers:
