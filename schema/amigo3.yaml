        range: integer
      activity_count:
        range: integer
      node_count:
        range: integer
      reported_protein_count:
        range: integer
      enabled_by_count:
        description: Distinct enabled_by entities among GO-CAM activities.
        range: integer
      causal_edge_count:
        description: Causal edges between enabled activities, including molecule-mediated chains (gocam-py).
        range: integer
      component_count:
        description: Weakly connected causal subgraphs of a GO-CAM, including isolated activities.
        range: integer
      longest_path_length:
        description: Longest shortest directed path, in edges, through causal edges (GO-CAMs) or sequential connections and ordered parts (modules).
        range: integer
      part_count:
        description: Conjunctive (AND) parts across all levels of a module.
        range: integer
      variant_set_count:
        description: Disjunctive (OR) branch points across all levels of a module.
        range: integer
      variant_count:
        description: Alternative variants across all variant sets of a module.
        range: integer
      realization_count:
        description: Distinct combinations of variants and optional parts a module admits; saturates at 10^12.
        range: integer
      max_depth:
        description: Deepest nesting of parts and variants below the module root.
        range: integer
      annoton_count:
        description: Annotons (leaf activities) across all levels of a module.
        range: integer
      connection_count:
        description: Curated connections across all levels of a module.
        range: integer
      has_review:
        range: boolean
