genes:
  dashboard:
    fields: [gene_product_type_groups, gene_product_types, species, has_review, evidence_codes, review_actions]
    group: gene_product_type_groups
    split: species
    cards: [species, has_review]
  recommended_sort:
    description: Exact search matches first; then proteins, reviewed records, and annotation count.
    sort:
      - {field: gene_product_types, value: Protein, direction: desc}
      - {field: has_review, direction: desc}
      - {field: annotation_count, direction: desc}
      - {field: symbol}
  sort_options:
    annotations:
      label: Most annotations
      sort: [{field: annotation_count, direction: desc}]
    reviewed:
      label: Reviewed first
      sort: [{field: has_review, direction: desc}, {field: symbol}]
  display_presets:
    compact:
      label: Compact
      fields: []
    details:
      label: Details
      fields:
      - identifiers
      - synonyms
      - evidence_codes
      - review_actions
  display_fields:
    identifiers: Identifiers
    gene_product_type_ids: Gene product type IDs
    synonyms: Synonyms
    taxon_id: Taxon
    annotated_subject_ids: Annotated subjects
    evidence_codes: Evidence codes
    term_ids: GO terms
    review_actions: Review actions
    review_description: Review summary
    review_path: Review source
  label: Genes & products
  title_field: symbol
  description_field: name
  facets: [species, gene_product_types, has_review, evidence_codes]
  facet_limits:
    gene_product_types: 50
  columns: [symbol, name, species, annotation_count, has_review]
  field_labels:
    gene_product_types: Gene product type
    gene_product_type_groups: Gene product type
    has_review: Gene review available
    review_actions: Review action
  review_count_note: Action facets count genes/products with that action anywhere in their review. Evidence and action filters may refer to different annotations on the same gene. Decisions have not been applied.
  facet_groups:
    - id: gene
      label: Gene / product
      fields: [species, gene_product_types, evidence_codes]
    - id: coverage
      label: Review coverage
      fields: [has_review]
    - id: review
      label: Gene review
      fields: [review_actions]
      visible_when:
        any_true_filters: [has_review]
        display_fields: [review_actions, review_description, review_path]
annotations:
  dashboard:
    fields: [species, evidence_code, method, aspect, assigned_by, is_redundant, has_review, has_annotation_review, review_actions, negation]
    group: species
    split: evidence_code
    cards: [species, evidence_code]
  recommended_sort:
    description: Exact gene-symbol matches first; then non-redundant, IBA, assessed, and non-IEA annotations.
    sort:
      - {field: is_redundant, value: false, direction: desc}
      - {field: evidence_code, value: IBA, direction: desc}
      - {field: has_annotation_review, direction: desc}
      - {field: evidence_code, value: IEA}
      - {field: gene_symbol}
      - {field: term_label}
  sort_options:
    agreement:
      label: Review agreement
      sort:
        - {field: review_actions, value: ACCEPT, direction: desc}
        - {field: evidence_code, value: IBA, direction: desc}
        - {field: is_redundant, value: false, direction: desc}
        - {field: has_annotation_review, direction: desc}
        - {field: evidence_code, value: IEA}
        - {field: term_label}
        - {field: gene_symbol}
    newest:
      label: Newest annotations
      sort: [{field: annotation_date, direction: desc}]
    term:
      label: GO term A–Z
      sort: [{field: term_label}, {field: gene_symbol}]
  label: Annotations
  title_field: gene_symbol
  description_field: term_label
  facets: [species, aspect, evidence_code, method, assigned_by, negation, is_redundant, has_review]
  columns: [gene_symbol, term_label, relation, evidence_code, method, assigned_by]
  review_count_note: Action facets count annotation rows with matching assessments. A row can appear under multiple actions; combined review filters may match different assessments on that row. Decisions have not been applied.
  field_labels:
    method: Method
    is_redundant: Redundant (broader term)
    has_review: Gene review available
    has_annotation_review: Matching assessment available
    review_actions: Assessment action
    review_replacement_ids: Proposed replacement term
    review_has_support: Supporting evidence recorded
    review_multiple: Multiple matching assessments
    review_count: Matching assessment count
  display_presets:
    compact:
      label: Compact
      fields: []
    review:
      label: Review
      fields: [assessments]
  display_fields:
    assessments: Review assessments
    db_object_id: Annotated subject
    with_or_from: With / from
    annotation_extensions: Annotation extensions
    annotation_date: Annotation date
    source_id: Source dataset
  facet_groups:
    - id: annotation
      label: Annotation
      fields: [species, aspect, evidence_code, method, assigned_by, negation, is_redundant]
    - id: coverage
      label: Review coverage
      fields: [has_review, has_annotation_review]
    - id: review
      label: Review assessment
      fields: [review_actions]
      more_fields: [review_replacement_ids, review_has_support, review_multiple]
      visible_when:
        any_true_filters: [has_review, has_annotation_review]
        display_fields: [assessments]
