gocams:
  dashboard:
    fields: [taxon_ids, status, has_review]
    group: taxon_ids
    split: status
    cards: [status, has_review]
    distributions: [activity_count, enabled_by_count, causal_edge_count, longest_path_length, component_count]
    joint: [activity_count, longest_path_length]
  # Integer facets shown as range sliders; definitions follow gocam-py's query index.
  range_facets:
    activity_count: {scale: log}
    enabled_by_count: {scale: log}
    causal_edge_count: {scale: log}
    longest_path_length: {scale: linear}
    component_count: {scale: log}
  recommended_sort:
    description: Exact search matches first; then reviewed models and activity count.
    sort: [{field: has_review, direction: desc}, {field: activity_count, direction: desc}, {field: label}]
  sort_options:
    activities:
      label: Most activities
      sort: [{field: activity_count, direction: desc}]
    longest_path:
      label: Longest causal path
      sort: [{field: longest_path_length, direction: desc}, {field: activity_count, direction: desc}]
  display_presets:
    compact:
      label: Compact
      fields: []
    details:
      label: Details
      fields:
      - gene_symbols
      - taxon_ids
      - term_ids
    structure:
      label: Structure
      fields: [activity_count, enabled_by_count, causal_edge_count, longest_path_length, component_count]
  display_fields:
    description: Full description
    gene_symbols: Genes
    gene_ids: Gene IDs
    participant_ids: Participants
    taxon_ids: Taxa
    term_ids: GO terms
    module_ids: Modules
    family_ids: Families
    has_review: Review available
    activity_count: Activities
    enabled_by_count: Enabling genes / complexes
    causal_edge_count: Causal edges
    longest_path_length: Longest causal path
    component_count: Disconnected subgraphs
  field_labels:
    activity_count: Activities
    enabled_by_count: Enabling genes / complexes
    causal_edge_count: Causal edges
    longest_path_length: Longest causal path
    component_count: Disconnected subgraphs
  label: GO-CAMs
  title_field: label
  description_field: description
  facets: [taxon_ids, status, has_review]
  columns: [label, taxon_ids, activity_count, has_review]
modules:
  dashboard:
    fields: [kind, scope, status]
    group: kind
    split: status
    cards: [kind, scope]
    distributions: [realization_count, variant_set_count, part_count, longest_path_length, max_depth, annoton_count]
    joint: [part_count, variant_set_count]
  # AND/OR structure: parts are conjunctive, variant sets are OR branch points.
  range_facets:
    realization_count: {scale: log}
    variant_set_count: {scale: linear}
    variant_count: {scale: linear}
    part_count: {scale: linear}
    longest_path_length: {scale: linear}
    max_depth: {scale: linear}
    annoton_count: {scale: log}
    connection_count: {scale: linear}
  recommended_sort:
    description: Exact search matches first; then reviewed modules and node count.
    sort: [{field: has_review, direction: desc}, {field: node_count, direction: desc}, {field: label}]
  sort_options:
    nodes:
      label: Most nodes
      sort: [{field: node_count, direction: desc}]
    variability:
      label: Most variable
      sort: [{field: realization_count, direction: desc}, {field: variant_set_count, direction: desc}]
    longest_path:
      label: Longest path
      sort: [{field: longest_path_length, direction: desc}, {field: part_count, direction: desc}]
  display_presets:
    compact:
      label: Compact
      fields: []
    details:
      label: Details
      fields:
      - scope
      - gene_symbols
      - term_ids
      - model_ids
    structure:
      label: Structure
      fields: [realization_count, variant_set_count, part_count, longest_path_length, max_depth, annoton_count]
  display_fields:
    description: Full description
    scope: Scope
    gene_symbols: Genes
    gene_ids: Gene IDs
    term_ids: GO terms
    family_ids: Families
    model_ids: GO-CAMs
    module_ids: Related modules
    taxon_ids: Taxa
    functional_coherence: Functional coherence
    has_review: Review available
    realization_count: Realizations (variability)
    variant_set_count: OR branch points
    variant_count: Variants
    part_count: AND parts
    longest_path_length: Longest path
    max_depth: Nesting depth
    annoton_count: Annotons
    connection_count: Connections
  field_labels:
    realization_count: Realizations (variability)
    variant_set_count: OR branch points
    variant_count: Variants
    part_count: AND parts
    longest_path_length: Longest path
    max_depth: Nesting depth
    annoton_count: Annotons
    connection_count: Connections
